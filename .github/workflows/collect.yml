# Saves India radar frames every 30 minutes into the "radar-data" release (daily .npz files).
name: Collect India radar

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backend/collect.py --release radar-data --dir data
